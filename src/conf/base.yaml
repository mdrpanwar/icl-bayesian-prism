inherit: 
    - models/standard.yaml
    - wandb.yaml

model:
    n_dims: 20
    n_positions: 101
    pos_encode: True
    # ICL training has no second-order grads, so SDPA's flash/efficient
    # backends are safe and faster. meta_base.yaml overrides this to "eager"
    # for second-order MAML.
    attn_implementation: sdpa

training:
    data: gaussian
    task_kwargs: {}
    batch_size: 64
    learning_rate: 0.0001
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 100000
    train_steps: 500001
    curriculum:
        dims:
            start: 5
            end: 20
            inc: 1
            interval: 2000
