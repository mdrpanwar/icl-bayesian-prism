inherit:
    - base.yaml

model:
    # Pair with meta.first_order:
    #   first_order: false -> attn_implementation: eager  (second-order MAML;
    #                                                      SDPA backward isn't
    #                                                      twice-differentiable)
    #   first_order: true  -> attn_implementation: sdpa   (FOMAML; SDPA dispatches
    #                                                      FlashAttention internally)
    attn_implementation: eager

training:
    batch_size: 8       # outer batch in train_meta.py is meta.meta_batch_size; this is unused but required by schema
    learning_rate: 0.0001
    train_steps: 500001
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 50000

meta:
    inner_lr: 0.01
    # Inner-loop learning-rate mode:
    #   fixed: use inner_lr as one scalar learning rate for all adapted params.
    #   learned_per_param: learn one inner-loop LR tensor per adapted param.
    inner_lr_mode: learned_per_param
    num_inner_steps: 2
    first_order: false
    meta_batch_size: 64    # 64 * 500001 = 32M tasks, matched with ICL's batch_size * train_steps
    num_query_points: 10

    # Support-size mode for the MAML inner-loop support set:
    #   match_curriculum: sample one k uniformly from [0, current curriculum n_points - 1].
    #   full_range: sample one k uniformly from [0, final curriculum n_points - 1].
    #   fixed: use exactly fixed_support_size examples; no support-size sampling.
    # Fixed mode ignores multi_k_support.
    vary_support_size: fixed # match_curriculum is the schema default
    fixed_support_size: 65   # required when vary_support_size: fixed; otherwise can be null

    # Multi-k support trains several support sizes for each task: zero-shot,
    # random small k, random medium k, and current max k. This only applies
    # when vary_support_size is match_curriculum or full_range.
    multi_k_support: false
    meta_eval_every_steps: 10000
    meta_eval_stride: 1
    meta_eval_num_tasks: 128
    run_icl_style_eval: false
    run_maml_style_eval: true
