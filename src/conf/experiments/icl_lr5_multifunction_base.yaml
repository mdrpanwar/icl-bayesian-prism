inherit:
    - ../linear_regression.yaml

model:
    n_dims: 5
    n_positions: 18
    n_embd: 128
    n_layer: 6
    n_head: 4
    pos_encode: false
    attn_implementation: eager
    attention_mode: causal
    prefix_condition_points: 5
    isolate_query_points: true
    num_task_slots: 3

training:
    task: multi_function_linear
    task_kwargs: {num_functions: 1, support_per_function: 5}
    batch_size: 64
    train_steps: 500001
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 100000
    eval_n_points: 6
    k_steps_for_loss: all
    loss_positions: "range:5:6"
    curriculum:
        dims: {start: 5, end: 5, inc: 1, interval: 2000}
        points: {start: 6, end: 6, inc: 1, interval: 2000}

out_dir: ../models/multi_function_linear

wandb:
    name: icl_lr5_multifunction
    notes: Interleaved tagged 5D linear functions; one query per function.
