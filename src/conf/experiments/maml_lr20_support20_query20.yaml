inherit:
    - ../meta/linear_regression.yaml

model:
    n_dims: 20
    n_positions: 41
    pos_encode: false
    attn_implementation: eager
    attention_mode: causal
    prefix_condition_points: null

training:
    train_steps: 500001
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 50000
    eval_n_points: 41
    curriculum:
        dims:
            start: 20
            end: 20
            inc: 1
            interval: 2000
        points:
            start: 20
            end: 20
            inc: 1
            interval: 2000

meta:
    inner_lr: 0.01
    inner_lr_mode: learned_per_param
    num_inner_steps: 2
    first_order: false
    meta_batch_size: 64
    num_query_points: 20
    vary_support_size: fixed
    fixed_support_size: 20
    multi_k_support: false
    meta_eval_every_steps: 5000
    meta_eval_stride: 20
    meta_eval_num_tasks: 128
    meta_eval_seed: 0
    run_icl_style_eval: false
    run_maml_style_eval: true

out_dir: ../models/meta_linear_regression

wandb:
    name: maml_lr20_support20_query20
    notes: Meta-SGD with fixed support 20 and 20 fresh query examples.
