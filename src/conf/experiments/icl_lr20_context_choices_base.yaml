inherit:
    - ../linear_regression.yaml

model:
    n_dims: 20
    n_positions: 41
    pos_encode: false
    attn_implementation: sdpa
    attention_mode: causal
    prefix_condition_points: null
    isolate_query_points: false

training:
    batch_size: 64
    train_steps: 500001
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 100000
    eval_n_points: 41
    k_steps_for_loss: all
    loss_positions: null
    loss_position_set: "10,15,20"
    curriculum:
        dims: {start: 20, end: 20, inc: 1, interval: 2000}
        points: {start: 21, end: 21, inc: 1, interval: 2000}

out_dir: ../models/linear_regression

wandb:
    name: icl_lr20_context_choices
    notes: One query at a joint loss at every configured support size.
