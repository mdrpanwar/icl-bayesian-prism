inherit:
    - ../linear_regression.yaml

model:
    n_dims: 20
    n_positions: 41
    pos_encode: false
    attention_mode: causal
    prefix_condition_points: null

training:
    batch_size: 64
    train_steps: 500001
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 100000
    eval_n_points: 41
    k_steps_for_loss: all
    loss_positions: "range:20:40"
    curriculum:
        dims:
            start: 20
            end: 20
            inc: 1
            interval: 2000
        points:
            start: 40
            end: 40
            inc: 1
            interval: 2000

out_dir: ../models/linear_regression

wandb:
    name: icl_lr20_condition20_loss20
    notes: First 20 pairs condition; objective is zero-based positions [20, 40).
