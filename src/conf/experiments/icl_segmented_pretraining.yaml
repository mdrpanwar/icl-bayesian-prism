inherit:
    - ../linear_regression.yaml

model:
    n_dims: 20
    n_positions: 41
    pos_encode: false
    attn_implementation: sdpa
    attention_mode: causal
    prefix_condition_points: null
    isolate_query_points: false

training:
    task: segmented_pretraining
    task_kwargs:
        min_segment_length: 1
        max_segment_length: 5
        families:
            - coordinate_affine
            - coordinate_offset
            - coordinate_quadratic
            - decision_stump
            - linear_regression
            - decision_tree
        decision_tree_depth: 4
    batch_size: 64
    train_steps: 500001
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 100000
    eval_n_points: 41
    k_steps_for_loss: all
    loss_positions: null
    curriculum:
        dims: {start: 20, end: 20, inc: 1, interval: 2000}
        points: {start: 41, end: 41, inc: 1, interval: 2000}

out_dir: ../models/segmented_pretraining

wandb:
    name: icl_segmented_pretraining
    notes: Unmarked 1-5-example segments from six normalized scalar function families.
