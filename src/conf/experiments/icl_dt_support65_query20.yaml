inherit:
    - ../decision_tree.yaml

model:
    n_positions: 101
    pos_encode: false
    attn_implementation: sdpa
    attention_mode: causal
    prefix_condition_points: null
    isolate_query_points: false

training:
    batch_size: 64
    train_steps: 500001
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 100000
    eval_n_points: 101
    k_steps_for_loss: all
    loss_positions: "range:65:85"
    curriculum:
        dims: {start: 20, end: 20, inc: 1, interval: 2000}
        points: {start: 85, end: 85, inc: 1, interval: 2000}

wandb:
    name: icl_dt_support65_query20
    notes: Matched decision-tree ICL with 65 support and 20 interacting queries.
