inherit:
    - ../linear_regression.yaml

model:
    n_dims: 20
    n_positions: 41
    pos_encode: true
    attention_mode: causal
    prefix_condition_points: null

training:
    train_steps: 500001
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 100000
    eval_n_points: 41
    k_steps_for_loss: "1"
    loss_positions: null
    curriculum:
        dims:
            start: 5
            end: 20
            inc: 1
            interval: 2000
        points:
            start: 21
            end: 21
            inc: 1
            interval: 2000

out_dir: ../models/linear_regression

wandb:
    name: icl_lr20_last1_positional
    notes: Last-one objective with learned absolute position embeddings.
