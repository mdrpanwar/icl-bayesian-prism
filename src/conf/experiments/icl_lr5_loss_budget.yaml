inherit:
    - ../linear_regression.yaml

model:
    n_dims: 5
    n_positions: 11
    n_embd: 128
    n_layer: 6
    n_head: 4
    pos_encode: false
    attn_implementation: sdpa
    attention_mode: causal
    prefix_condition_points: null

training:
    batch_size: 64
    train_steps: 200000
    eval_every_steps: 1000
    save_every_steps: 1000
    keep_every_steps: 100000
    eval_n_points: 11
    curriculum:
        dims:
            start: 5
            end: 5
            inc: 1
            interval: 2000
        points:
            start: 11
            end: 11
            inc: 1
            interval: 2000

out_dir: ../models/linear_regression

wandb:
    name: icl_lr5_loss_budget
    notes: Fixed 5D/length-11 loss-budget comparison; evaluate error at context 5.
