name: icl-metal
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cu121
    # Hard pins:
    - torch==2.4.*           # torch.func.vmap/grad, SDPA
    - transformers==4.46.*   # GPT-2 SDPA default (FA-2 dispatch on supported HW)
    # quinine 0.3.0's transitive deps, relaxed so pip picks wheels:
    - pyyaml
    - Cerberus
    - cytoolz
    - funcy
    - gin-config
    - munch
    - toposort
    # everything else — let pip pick latest compatible:
    - wandb
    - numpy
    - matplotlib
    - pandas
    - scikit-learn
    - tqdm
    - seaborn
    - xgboost
    - jupyter
# NOTE: quinine itself is installed by setup_env.sh with --no-deps, since its
# 0.3.0 metadata has stale strict pins (pyyaml==5.4) that don't build on py3.10.
